<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Message sent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='contact.css') }}">
</head>
<body>
    <main class="panel success" aria-labelledby="title">
        <span class="success-icon" aria-hidden="true">✓</span>
        <h1 id="title">Message sent</h1>
        <p class="intro">We’ve received your message and will get back to you using the contact details you provided.</p>
        <a href="{{ return_url|default(url_for('index')) }}" class="primary">
            {{ 'Send another message' if return_url is defined else 'Back to the contact form' }}
        </a>
    </main>
</body>
</html>
