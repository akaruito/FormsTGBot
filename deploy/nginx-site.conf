# Include in nginx's http context, for example via /etc/nginx/sites-enabled/.
limit_req_zone $binary_remote_addr zone=forms_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=forms_submit:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=forms_connections:10m;
log_format forms_privacy '$time_iso8601 $request_method $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name forms.example.com;
    server_tokens off;

    access_log /var/log/nginx/forms-access.log forms_privacy;
    error_log /var/log/nginx/forms-error.log crit;
    return 308 https://forms.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name forms.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/forms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/forms-access.log forms_privacy;
    error_log /var/log/nginx/forms-error.log crit;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;
    limit_conn forms_connections 20;
    limit_conn_status 429;
    limit_req_status 429;
    limit_req zone=forms_requests burst=20 nodelay;

    proxy_cache off;
    proxy_hide_header Strict-Transport-Security;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $server_name;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 20s;

    location = /submit-form {
        limit_req zone=forms_requests burst=20 nodelay;
        limit_req zone=forms_submit burst=4 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
